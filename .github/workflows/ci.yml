name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一个分支连续推送时，取消上一次没跑完的
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 + 自检
    runs-on: macos-26

    steps:
      - name: 取出代码
        uses: actions/checkout@v7

      - name: 工具链版本
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: 编译
        run: ./scripts/build.sh release

      - name: 自检
        # 自检不需要辅助功能权限，在 CI 上可以完整跑
        run: ./build/LayoutSnap.app/Contents/MacOS/LayoutSnap --selftest

      - name: 命令行模式冒烟
        run: |
          ./build/LayoutSnap.app/Contents/MacOS/LayoutSnap --help
          ./build/LayoutSnap.app/Contents/MacOS/LayoutSnap --doctor

      - name: 打包成 zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/LayoutSnap.app dist/LayoutSnap-ci.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: LayoutSnap-ci
          path: dist/LayoutSnap-ci.zip
          retention-days: 7
